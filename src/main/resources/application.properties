spring.application.name=SeaGuard
server.port=8080
spring.profiles.default=h2
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
seaguard.vision.endpoint=${SEAGUARD_VISION_ENDPOINT:http://127.0.0.1:18121/v1/chat/completions}
seaguard.vision.model=${SEAGUARD_VISION_MODEL:seaguard-vision}
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=3MB
# See application-mysql.properties and README.md
