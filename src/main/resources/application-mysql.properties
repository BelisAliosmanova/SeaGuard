# Main persistent database. Configure DB_USER and DB_PASSWORD in IntelliJ environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/seaguard?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:seaguard}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Opt-in automatic model-data archive; no fake fallback data.
seaguard.marine.sync.enabled=${MARINE_SYNC_ENABLED:false}
seaguard.marine.sync.delay-ms=${MARINE_SYNC_DELAY_MS:10800000}
