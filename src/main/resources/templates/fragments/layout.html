<!doctype html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Shared <head> assets: fonts, design tokens and shell. -->
<th:block th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title th:text="${title} + ' | SeaGuard'">SeaGuard</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</th:block>

<!-- Icon sprite used by every page. -->
<svg th:fragment="symbols" xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
    <symbol id="i-brand" viewBox="0 0 24 24"><path d="M4 9c4.7 0 6.6-4 10.6-4C17 5 19 6 20 7.5M4 14c4.7 0 6.6-4 10.6-4C17 10 19 11 20 12.5M4 19c4.7 0 6.6-4 10.6-4C17 15 19 16 20 17.5"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-5 4 2 5-6"/></symbol>
    <symbol id="i-water" viewBox="0 0 24 24"><path d="M2 8c2 0 2-2 5-2s3 2 5 2 2-2 5-2 3 2 5 2M2 13c2 0 2-2 5-2s3 2 5 2 2-2 5-2 3 2 5 2M2 18c2 0 2-2 5-2s3 2 5 2 2-2 5-2 3 2 5 2"/></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6m-5 0v7L5 19a1.5 1.5 0 0 0 1.3 2h11.4a1.5 1.5 0 0 0 1.3-2l-5-9V3M8 15h8"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 9v11"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4m0 10v4M3 12h4m10 0h4M6.3 6.3l2.5 2.5m6.4 6.4 2.5 2.5m0-11.4-2.5 2.5m-6.4 6.4-2.5 2.5"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M6 21c0-9 3-15 12-17-1 9-5 14-12 17Zm0 0c2-5 5-8 8-10"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12 20 4l-5 16-3-7-8-1Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4a1 1 0 0 1 1 1v11H3V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4h16v-4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5M20 20v-4h-4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4m0 3v.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8v.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l11-7Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-thermo" viewBox="0 0 24 24"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0Z"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 15c3 0 3-5 6-5s3 5 6 5 3-5 6-5M2 20h20"/></symbol>
    <symbol id="i-current" viewBox="0 0 24 24"><path d="M3 8h13l-3-3M21 16H8l3 3"/></symbol>
</svg>

<!-- Shared navigation. `active` is one of: dashboard, ecologist, field, simulation, dive. -->
<aside th:fragment="rail(active)" class="site-nav">
    <div class="site-nav-inner">
        <a class="brand" aria-label="SeaGuard" th:href="@{/}">
            <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-brand"/></svg></span>
            <span class="brand-name">SeaGuard</span>
        </a>
        <nav id="primary-nav" aria-label="Основна навигация">
            <a aria-label="Преглед" title="Преглед" th:href="@{/dashboard}" th:attr="aria-current=${active == 'dashboard'} ? 'page' : null"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg><span class="nav-label">Преглед</span></a>
            <a aria-label="Участък" title="Участък" th:href="@{/ecologist}" th:attr="aria-current=${active == 'ecologist'} ? 'page' : null"><svg class="icon" aria-hidden="true"><use href="#i-spark"/></svg><span class="nav-label">Участък</span></a>
            <a aria-label="Теренна работа" title="Теренна работа" th:href="@{/field}" th:attr="aria-current=${active == 'field'} ? 'page' : null"><svg class="icon" aria-hidden="true"><use href="#i-table"/></svg><span class="nav-label">Теренна работа</span></a>
            <a aria-label="Морска симулация" title="Морска симулация" th:href="@{/simulation}" th:attr="aria-current=${active == 'simulation'} ? 'page' : null"><svg class="icon" aria-hidden="true"><use href="#i-water"/></svg><span class="nav-label">Симулация</span></a>
            <a aria-label="Под вълните" title="Под вълните" th:href="@{/under-the-waves}" th:attr="aria-current=${active == 'dive'} ? 'page' : null"><svg class="icon" aria-hidden="true"><use href="#i-wave"/></svg><span class="nav-label">Под вълните</span></a>
        </nav>
        <a class="button primary nav-cta" aria-label="Ново измерване" th:href="@{/measurements/new}"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span class="nav-action-label">Ново измерване</span></a>
    </div>
</aside>

</body>
</html>
