<!doctype html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ново измерване | SeaGuard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" th:href="@{/}">🌊 SeaGuard</a></div></nav><main class="container py-4" style="max-width:800px"><h1 class="h3">Добави измерване</h1><p class="small-note">Въвеждайте само действително измерени стойности и посочвайте източника им. Не измисляйте екологични данни.</p><form th:action="@{/measurements}" th:object="${measurement}" method="post" class="card p-4 shadow-sm"><div class="row g-3"><div class="col-md-6"><label class="form-label">Място *</label><input class="form-control" th:field="*{locationName}" required maxlength="120"><div class="text-danger" th:errors="*{locationName}"></div></div><div class="col-md-6"><label class="form-label">Дата и час на измерване *</label><input class="form-control" type="datetime-local" th:field="*{observedAt}" required><div class="text-danger" th:errors="*{observedAt}"></div></div><div class="col-md-4"><label class="form-label">Температура (°C) *</label><input class="form-control" type="number" step="any" th:field="*{temperatureC}" required><div class="text-danger" th:errors="*{temperatureC}"></div></div><div class="col-md-4"><label class="form-label">Мътност (NTU)</label><input class="form-control" type="number" min="0" step="any" th:field="*{turbidityNtu}"><div class="text-danger" th:errors="*{turbidityNtu}"></div></div><div class="col-md-4"><label class="form-label">Соленост (PSU)</label><input class="form-control" type="number" min="0" max="50" step="any" th:field="*{salinityPsu}"><div class="text-danger" th:errors="*{salinityPsu}"></div></div><div class="col-md-6"><label class="form-label">Географска ширина (по желание)</label><input class="form-control" type="number" step="any" min="-90" max="90" th:field="*{latitude}" placeholder="напр. 42.415"></div><div class="col-md-6"><label class="form-label">Географска дължина (по желание)</label><input class="form-control" type="number" step="any" min="-180" max="180" th:field="*{longitude}" placeholder="напр. 27.695"></div><div class="col-12"><label class="form-label">Източник (институция, файл, URL или измервателен уред) *</label><input class="form-control" th:field="*{source}" required maxlength="200"><div class="text-danger" th:errors="*{source}"></div></div><div class="col-12"><label class="form-label">Бележки</label><textarea class="form-control" rows="3" th:field="*{notes}" maxlength="500"></textarea></div></div><div class="mt-4"><button class="btn btn-success" type="submit">Запази измерването</button> <a class="btn btn-outline-secondary" th:href="@{/measurements}">Отказ</a></div></form></main></body></html>
