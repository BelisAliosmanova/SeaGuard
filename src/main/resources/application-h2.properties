# Optional temporary database for development only; restart loses all rows.
spring.datasource.url=jdbc:h2:mem:seaguard;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
seaguard.marine.sync.enabled=false
# H2 web console for local demo debugging only.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
